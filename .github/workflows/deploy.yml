name: Build & Deploy (Hugo → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.160.1"
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Check source freshness (asOf dates)
        run: node scripts/check-staleness.mjs

      # A direct push to main skips pr-check entirely, so the i18n gates run
      # here too — otherwise a mismatched or stale translation ships.
      - name: Check i18n parity (stage + data surfaces)
        run: node scripts/check-i18n-parity.mjs

      - name: Check UI i18n parity (i18n/en.yaml vs ru.yaml)
        run: node scripts/check-ui-i18n-parity.mjs

      - name: Check translation freshness (sourceHash)
        run: node scripts/check-i18n-freshness.mjs

      - name: Generate source-line map (for GitHub blame links)
        run: node scripts/gen-source-lines.mjs

      - name: Generate build data (stats + changelog)
        run: node scripts/gen-build-data.mjs

      - name: Generate OG images
        run: node scripts/gen-og.mjs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Build site
        run: hugo --gc --minify --baseURL "https://ohmoveagain.com/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Exposed so the verify job below can smoke-check the real published URL
    # rather than a hardcoded guess (which would silently go stale on the
    # move to ohmoveagain.com).
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # actions/deploy-pages@v5.0.0

  # Every gate up to here judges a build artifact, not the running site.
  # A green deploy has so far meant "upload succeeded", which is not the same
  # as "the site works". This checks the real URL after publish.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-check the deployed site
        env:
          SITE: ${{ needs.deploy.outputs.page_url || 'https://ohmoveagain.com/' }}
        run: |
          set -euo pipefail
          echo "Verifying ${SITE}"

          # Pages propagation is not instant; give it a bounded window.
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' -L --max-time 20 "${SITE}" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt ${attempt}: HTTP ${code}, retrying in 15s"
            sleep 15
          done

          if [ "$code" != "200" ]; then
            echo "::error::Home page returned HTTP ${code} after deploy"
            exit 1
          fi

          # A 200 that renders an empty shell is still a broken deploy.
          for needle in "ohmoveagain" "<html" "</body>"; do
            if ! grep -qi -- "$needle" /tmp/home.html; then
              echo "::error::Deployed home page is missing expected content: ${needle}"
              exit 1
            fi
          done

          # Key routes must resolve too — a partial build breaks these first.
          fail=0
          for path in "pipeline/" "calculator/" "ru/" "sitemap.xml"; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "${SITE}${path}" || echo 000)
            if [ "$c" = "200" ]; then
              echo "ok   ${c}  ${path}"
            else
              echo "FAIL ${c}  ${path}"; fail=$((fail+1))
            fi
          done

          if [ "$fail" -gt 0 ]; then
            echo "::error::${fail} key route(s) failed after deploy"
            exit 1
          fi

          echo "Deploy verified: home + $(echo 'pipeline calculator ru sitemap' | wc -w | tr -d ' ') key routes serving." \
            >> "$GITHUB_STEP_SUMMARY"
