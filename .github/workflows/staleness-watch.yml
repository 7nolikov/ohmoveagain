name: Staleness watch

# Runs weekly. Opens a GitHub issue listing sources within 30d of their tier
# staleness threshold (or already past it), so the maintainer can re-verify
# before the next build-break. Build-break on CI remains the hard safety net.
#
# Tiers and their fail thresholds (A-TR7):
#   official      365d   →  warn at 335d
#   supranational 180d   →  warn at 150d
#   community      90d   →  warn at  60d

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC
  workflow_dispatch:       # manual trigger for testing

permissions:
  issues: write

# Same reason as linkcheck: a dispatch racing the Monday cron would open
# the staleness issue twice.
concurrency:
  group: staleness-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Run staleness check (JSON)
        id: check
        run: |
          # `set -e` would abort here the moment anything is past its threshold
          # — which is the case this workflow exists for. The old `echo $?`
          # after the redirect was therefore unreachable on every run that had
          # something to report.
          set +e
          node scripts/check-staleness.mjs --json > /tmp/staleness.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the staleness issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILS=$(node -e "const d=require('/tmp/staleness.json'); process.stdout.write(String(d.fails.length))")
          WARNS=$(node -e "const d=require('/tmp/staleness.json'); process.stdout.write(String(d.warns.length))")

          # One issue per week, and nothing ever closed them: #68 and #71 were
          # both open on 2026-09-13 listing the same two offices.yaml entries,
          # a week apart, after the entries had been fixed. Reuse the open one
          # and close it when the tree is clean — a weekly reminder that
          # outlives the thing it reminds you of is not a reminder.
          EXISTING=$(gh issue list \
            --state open --label staleness \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ "$FAILS" -eq 0 ] && [ "$WARNS" -eq 0 ]; then
            echo "No staleness findings."
            if [ -n "$EXISTING" ]; then
              gh issue list --state open --label staleness --json number --jq '.[].number' \
              | while read -r number; do
                  [ -n "$number" ] || continue
                  gh issue close "$number" \
                    --comment "Every source is inside its re-verification threshold as of run ${GITHUB_RUN_ID}. Closing automatically."
                done
            fi
            exit 0
          fi

          BODY=$(node -e "
            const d = require('/tmp/staleness.json');
            const fmt = (f) => {
              const tier = f.tier ? \` (\${f.tier})\` : '';
              const ctx = f.source ? \` — source: \${f.source}\` : f.claim ? \` — claim: \${f.claim}\` : '';
              return \`- \${f.level} \${f.file}\${tier}: \${f.kind}=\${f.date || ''}, age=\${f.age}d\${ctx}\`;
            };
            const lines = [...d.fails.map(fmt), ...d.warns.map(fmt)];
            process.stdout.write(lines.join('\n'));
          ")

          WEEK=$(date +%Y-W%V)
          TITLE="Staleness watch ${WEEK}: ${FAILS} failed, ${WARNS} approaching"

          # Create the label if it is missing — gh aborts the whole issue
          # creation with "label not found", which silently swallowed the
          # weekly warning for five consecutive runs.
          gh label create staleness \
            --color "d4c5f9" \
            --description "Sources approaching or past their re-verification threshold" \
            --force

          ISSUE_BODY=$(printf "Sources that need re-verification before they break the build.\n\n%s\n\nRun \`node scripts/check-staleness.mjs\` locally for full output." "$BODY")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$ISSUE_BODY"
            echo "updated issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body "$ISSUE_BODY" --label "staleness"
          fi
