name: i18n translate + validate content

on:
  push:
    branches: [main]
    paths:
      - 'content/stages/**/*.md'
      - 'data/i18n/**'
  pull_request:
    paths:
      - 'content/stages/**/*.md'
      - 'data/i18n/**'
  # Manual re-run: lets the pipeline pick up script-only fixes (e.g. payload
  # chunking) that don't touch the content/data paths above.
  workflow_dispatch:

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-pipeline:
    name: Translation sync + validation
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync translations (AI)
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: npm run i18n:sync:ru

      - name: Validate translation structure (parity)
        run: npm run i18n:parity

      - name: Validate translation freshness (strict)
        run: npm run i18n:freshness

      - name: Open PR for translation changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet; then
            echo "no translation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="i18n/auto-sync"
          git checkout -B "$BRANCH"

          # Stage every surface sync-ru-translations.mjs writes, not just the
          # stage files. It also regenerates the page-content surfaces
          # (content/forms/_index.<lang>.md, content/offices.<lang>.md) and the
          # reference-data surfaces (data/i18n/*.<lang>.yaml). Staging only
          # content/stages meant a sync that touched just those left nothing
          # staged, so `git commit` exited 1 and failed the whole run.
          git add content/stages content/forms content/offices.*.md data/i18n

          if git diff --cached --quiet; then
            echo "sync produced no changes on a tracked translation surface"
            exit 0
          fi

          git commit -m "chore(i18n): auto-sync translations"
          git push origin "$BRANCH" --force

          # Filter by state=open — gh pr view returns merged PRs too, so a
          # previously-merged PR on this fixed branch would otherwise block
          # every future re-sync from opening a new PR.
          if [ -z "$(gh pr list --state open --head "$BRANCH" --json number -q '.[].number')" ]; then
            gh pr create \
              --title "chore(i18n): auto-sync translations" \
              --body "Automated translation sync. Review translated strings before merging — LLM output flows into \`safeHTML\`/\`safeJS\` templates." \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
