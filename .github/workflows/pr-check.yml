name: PR quality check (a11y + Lighthouse)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'i18n/**'
      - 'data/i18n/**'
      - 'launch/**'
      # Root-level docs only (README, DECISIONS, etc.).
      # content/**/*.md is NOT ignored — translation/content edits render and
      # must run the a11y + Lighthouse + E2E gate.
      - '*.md'

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: "0.160.1"
  TZ: UTC
  PORT: 4000

jobs:
  quality:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Check source freshness (asOf dates)
        run: node scripts/check-staleness.mjs

      - name: Check i18n parity
        run: node scripts/check-i18n-parity.mjs

      - name: Generate source-line map (for GitHub blame links)
        run: node scripts/gen-source-lines.mjs

      - name: Generate build data (stats + changelog)
        run: node scripts/gen-build-data.mjs

      - name: Build site (localhost base URL for audit)
        run: |
          hugo --gc --minify --baseURL "http://localhost:${{ env.PORT }}/ohmoveagain/"
          # Mirror the subpath so that /ohmoveagain/* resolves under the static
          # server (matches production layout at https://7nolikov.dev/ohmoveagain/).
          mkdir _serve
          mv public _serve/ohmoveagain
          # `serve` (serve-handler) auto-serves /404.html for missing paths.
          # Copy Hugo's 404 to the root so the test sees the real page, not
          # serve's bare default. Mirrors production (Cloudflare Pages 404).
          cp _serve/ohmoveagain/404.html _serve/404.html

      - name: Start static file server
        run: |
          npx serve ./_serve -l ${{ env.PORT }} &
          sleep 4

      - name: Install matching Chrome + ChromeDriver
        run: npx browser-driver-manager install chrome

      - name: Axe accessibility audit
        run: |
          npx @axe-core/cli \
            http://localhost:${{ env.PORT }}/ohmoveagain/ \
            http://localhost:${{ env.PORT }}/ohmoveagain/pipeline/ \
            http://localhost:${{ env.PORT }}/ohmoveagain/calculator/ \
            --exit \
            --disable color-contrast

      - name: Lighthouse CI audit
        run: |
          npx lhci autorun \
            --collect.url="http://localhost:${{ env.PORT }}/ohmoveagain/" \
            --collect.url="http://localhost:${{ env.PORT }}/ohmoveagain/pipeline/" \
            --collect.url="http://localhost:${{ env.PORT }}/ohmoveagain/calculator/"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (desktop + no-js only)
        run: npx playwright test --project desktop --project no-js
        env:
          BASE_URL: http://localhost:${{ env.PORT }}
          SITE_SUBPATH: /ohmoveagain
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
