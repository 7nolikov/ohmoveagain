name: Link check (weekly)

# Cron-only — no `push:` trigger.
# Hits dozens of government source URLs; we don't want to bombard them on every commit.
# Trigger manually via the Actions tab if a one-off check is needed.
on:
  schedule:
    - cron: '0 6 * * 0'  # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Both triggers can fire at once — a manual dispatch while the Sunday cron
# run is in flight would have two runs filing the same broken-link issue.
concurrency:
  group: linkcheck
  cancel-in-progress: true

# Kept in the same shape as deploy.yml and pr-check.yml — the version was
# hardcoded here while the other two read an env var, which is exactly how a
# link check ends up silently auditing a different build than it ships.
env:
  HUGO_VERSION: "0.160.1"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: hugo --gc --minify --baseURL "https://ohmoveagain.com/"

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # lycheeverse/lychee-action@v2
        with:
          # This job exists to catch rot in third-party government source
          # links, so it judges those only:
          #   --scheme http/https  drops local file:// links (internal routing
          #                        is covered by the deploy build + Playwright)
          #   --root-dir           lets root-relative hrefs resolve to files so
          #                        they can be dropped rather than error out
          #   --exclude            skips our own pages, which are not yet
          #                        published at the URL a PR build refers to
          # accept 200/206 (ok), 403/429 (gov sites blocking bots — URL still valid)
          # Mail links are skipped by default; `--exclude-mail` is not a valid
          # lychee flag and made the whole run abort with a usage error.
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,403,429
            --timeout 20
            --root-dir ${{ github.workspace }}/public
            --scheme https
            --scheme http
            --exclude '^https://ohmoveagain\.com'
            './public/**/*.html'
          fail: false
          output: ./lychee/out.md

      - name: Open issue if links broken
        # lychee-action v2 exposes the code as a step output, not an env var.
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # peter-evans/create-issue-from-file@v6.0.0
        with:
          title: "Broken source links detected by weekly link check"
          content-filepath: ./lychee/out.md
          labels: |
            broken-links
            maintenance
