name: Link check (weekly)

# Cron-only — no `push:` trigger.
# Hits dozens of government source URLs; we don't want to bombard them on every commit.
# Trigger manually via the Actions tab if a one-off check is needed.
on:
  schedule:
    - cron: '0 6 * * 0'  # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Both triggers can fire at once — a manual dispatch while the Sunday cron
# run is in flight would have two runs filing the same broken-link issue.
concurrency:
  group: linkcheck
  cancel-in-progress: true

# Kept in the same shape as deploy.yml and pr-check.yml — the version was
# hardcoded here while the other two read an env var, which is exactly how a
# link check ends up silently auditing a different build than it ships.
env:
  HUGO_VERSION: "0.160.1"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # check-source-urls.mjs parses the YAML with the `yaml` package, so this
      # job needs Node now. It did not before.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        run: hugo --gc --minify --baseURL "https://ohmoveagain.com/"

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # lycheeverse/lychee-action@v2
        with:
          # This job exists to catch rot in third-party government source
          # links, so it judges those only:
          #   --scheme http/https  drops local file:// links (internal routing
          #                        is covered by the deploy build + Playwright)
          #   --root-dir           lets root-relative hrefs resolve to files so
          #                        they can be dropped rather than error out
          #   --exclude            skips our own pages, which are not yet
          #                        published at the URL a PR build refers to
          # accept 200/206 (ok), 403/429 (gov sites blocking bots — URL still valid)
          # Mail links are skipped by default; `--exclude-mail` is not a valid
          # lychee flag and made the whole run abort with a usage error.
          #
          # Timeout is 45s rather than the default. It is not what fixed
          # gesetze-im-internet.de — see that exclusion below — but a longer
          # budget costs nothing on a weekly cron and removes one class of
          # false alarm before the re-check step has to adjudicate it.
          #
          # gesetze-im-internet.de is excluded on evidence, not suspicion. The
          # re-check in run 34777759007 hit it three times, 15s apart, from the
          # runner and got HTTP 000 every time — the connection never
          # completed. The same three requests from a desktop return 200 in
          # 0.13s, and the page still carries the "zwei Wochen" deadline the
          # citation depends on. The Bundesamt für Justiz does not accept
          # traffic from this datacenter; that is not something a link check
          # can fix or should keep reporting. The §17 BMG text stays the source
          # because it is the law, and no mirror of it is `official` tier.
          #
          # Both exclusions are covered by something else: every URL here also
          # carries an asOf date in data/stages/*.yaml, and the staleness watch
          # forces a human to open it and re-read the rule on a fixed cadence.
          # Excluding a URL from the automated check does not make it unwatched.
          #
          # zso.gov.rs is excluded on a TLS technicality, not because it rotted.
          # It answers 200 and its certificate covers the hostname, but it
          # serves the leaf alone with no Let's Encrypt intermediate. Browsers
          # and curl paper over that from cache; lychee's rustls trust store
          # will not, so every run reports "SSL certificate not trusted". The
          # fix belongs to the Serbian government, and the alternative source
          # is worse — rfzo.rs currently closes the connection outright, which
          # is exactly why the RS health-insurance item points at ZSO.
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,403,429
            --timeout 45
            --root-dir ${{ github.workspace }}/public
            --scheme https
            --scheme http
            --exclude '^https://ohmoveagain\.com'
            --exclude '^https?://(www\.)?zso\.gov\.rs'
            --exclude '^https?://(www\.)?gesetze-im-internet\.de'
            './public/**/*.html'
          fail: false
          output: ./lychee/out.md

      # A different question from lychee's, and the one it structurally cannot
      # answer: not "does this URL respond" but "does it still respond from
      # where the repo says it lives". See scripts/check-source-urls.mjs — on
      # 2026-09-13 all 92 URLs passed lychee while Poland's income-tax source
      # was a redirect to gov.pl's homepage.
      - name: Source URLs must resolve to themselves
        id: sourceurls
        run: |
          mkdir -p ./lychee
          set +e
          node scripts/check-source-urls.mjs > ./lychee/source-urls.txt 2>&1
          status=$?
          set -e

          cat ./lychee/source-urls.txt
          {
            echo '### Source URL drift'
            echo '```'
            cat ./lychee/source-urls.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) echo "moved=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "moved=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::check-source-urls.mjs failed with status $status"; exit "$status" ;;
          esac

      # lychee's verdict is a first opinion, not the finding. Four consecutive
      # weekly runs each named a different government site as broken and every
      # one of them answered 200 minutes later; gov.me was observed returning
      # 404 and then 200 to back-to-back requests from the same machine. This
      # re-checks only what failed, several times, with real gaps — see the
      # script for why lychee's own retries do not cover it.
      - name: Confirm the failures before filing anything
        id: confirm
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          # Not `script | tee`: without pipefail `if` would read tee's status,
          # which is always 0, and every run would look clean.
          set +e
          .github/scripts/confirm-broken-links.sh ./lychee/out.md ./lychee/confirmed.md \
            > ./lychee/confirm.log 2>&1
          status=$?
          set -e

          cat ./lychee/confirm.log
          {
            echo '### Link re-check'
            echo '```'
            cat ./lychee/confirm.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) echo "dead=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "dead=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::confirm-broken-links.sh failed with status $status"; exit "$status" ;;
          esac

      # create-issue-from-file opens a NEW issue every time it runs, and this
      # job runs every Sunday. One unfixable link therefore produced one
      # identical issue per week — three were open at once by 2026-09-13.
      # Reuse the open one instead: the report is a full snapshot of every
      # link on the site, so the newest overwrite loses nothing.
      # One issue covers both findings. They are the same maintenance job —
      # a URL in data/ no longer points at the page the claim was read from —
      # and splitting them would just recreate the churn #75 removed.
      - name: Assemble the issue body
        id: body
        if: steps.confirm.outputs.dead == 'true' || steps.sourceurls.outputs.moved == 'true'
        run: |
          : > ./lychee/issue.md

          if [ "${{ steps.sourceurls.outputs.moved }}" = "true" ]; then
            {
              echo "# Source URLs that moved"
              echo
              echo "These URLs answer, but not from where \`data/\` says they live."
              echo "Either update the URL or replace the source — a redirect to a"
              echo "landing page means the cited page is gone."
              echo
              echo '```'
              cat ./lychee/source-urls.txt
              echo '```'
              echo
            } >> ./lychee/issue.md
          fi

          if [ "${{ steps.confirm.outputs.dead }}" = "true" ]; then
            cat ./lychee/confirmed.md >> ./lychee/issue.md
          fi

          cat ./lychee/issue.md

      - name: Find the open broken-links issue
        id: existing
        if: steps.confirm.outputs.dead == 'true' || steps.sourceurls.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open --label broken-links \
            --limit 1 --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "reusing issue: ${number:-none, will open a new one}"

      - name: Open or update issue if anything survived
        if: steps.confirm.outputs.dead == 'true' || steps.sourceurls.outputs.moved == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # peter-evans/create-issue-from-file@v6.0.0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          title: "Source links need attention (weekly check)"
          content-filepath: ./lychee/issue.md
          labels: |
            broken-links
            maintenance

      # The other half of the churn: nothing ever closed these. An issue that
      # outlives the breakage it reports turns the label into noise, so a run
      # that ends up with nothing confirmed closes whatever the last one opened.
      - name: Close broken-links issues when nothing is confirmed
        if: >-
          steps.sourceurls.outputs.moved == 'false'
          && (steps.lychee.outputs.exit_code == '0' || steps.confirm.outputs.dead == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open --label broken-links \
            --json number --jq '.[].number' \
          | while read -r number; do
              [ -n "$number" ] || continue
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "Every source URL resolves to itself, and no link failed both lychee and the re-check, in run ${GITHUB_RUN_ID}. Closing automatically."
            done
