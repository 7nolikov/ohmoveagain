    lastReviewed: "2026-04-24"

  - id: blue-card-salary
    impact: "Ineligible application"
    sourceId: eu-blue-card
    lastReviewed: "2026-04-24"

checklist:
  - id: tax-math
    items:
      - id: effective-tax-rate
      - id: runway-delta
        source:
          url: "https://ohmoveagain.com/calculator/"
          asOf: "2026-04-18"
      - id: exit-taxes
        source:
          url: "https://europa.eu/youreurope/citizens/work/taxes/index_en.htm"
          asOf: "2026-07-28"

  - id: visa-pathway
    items:
      - id: visa-audit
        source:
          url: "https://mup.gov.hr/stay-in-the-republic-of-croatia/281621"
          asOf: "2026-02-15"
      - id: filing-location
        source:
          url: "https://mup.gov.hr/aliens-281621/stay-and-work/temporary-stay-of-third-country-nationals/281661"
          asOf: "2026-07-28"
      - id: blue-card-salary
        appliesTo:
          visa: [blue-card]
      - id: dnv-income
        appliesTo:
          visa: [digital-nomad]
      - id: work-permit-sponsor
        appliesTo:
          visa: [work-permit]
        source:
          url: "https://mup.gov.hr/stay-in-the-republic-of-croatia/281621"
          asOf: "2026-02-15"
      - id: self-employment-register
        appliesTo:
          visa: [self-employment]
        source:
          url: "https://www.porezna-uprava.hr/en/Pages/default.aspx"
          asOf: "2026-03-01"
      - id: eu-eea-free-movement
        appliesTo:
          visa: [eu-eea]
        source:
          url: "https://mup.gov.hr/stay-in-the-republic-of-croatia/281621"
          asOf: "2026-02-15"
      - id: family-reunification-income
        appliesTo:
          visa: [family-reunification]
        source:
          url: "https://mup.gov.hr/stay-in-the-republic-of-croatia/281621"
          asOf: "2026-02-15"

  - id: reality-check
    items:
      - id: career-market
        source:
          url: "https://survey.stackoverflow.co/"
          asOf: "2026-04-01"
      - id: partner-alignment
        source:
          url: "https://www.oecd.org/els/mig/World-Migration-in-Figures.pdf"
          asOf: "2026-04-01"
      - id: medical-baseline
        source:
          url: "https://www.who.int/health-topics/travel-and-health"
          asOf: "2026-05-01"

artifacts:
  - id: runway-calc
    kind: calc
    href: "/calculator/"
