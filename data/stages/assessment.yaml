version: 2

sources:
  - id: mup-main
    url: "https://mup.gov.hr/stay-in-the-republic-of-croatia/281621"
    type: official
    lastChecked: "2026-02-15"

  - id: eu-blue-card
    url: "https://home-affairs.ec.europa.eu/policies/migration-and-asylum/legal-migration-and-resettlement/work_en"
    type: supranational
    lastChecked: "2026-07-25"

  - id: porezna
    url: "https://www.porezna-uprava.hr/en/Pages/default.aspx"
    type: official
    lastChecked: "2026-03-01"

claims:
  - id: effective-tax-rate
    impact: "Incorrect financial planning"
    sourceId: porezna

  - id: dnv-income
    impact: "Visa rejection"
