# Translatable strings for data/stages/exit.yaml.
# Country display names keyed by code; item label/note keyed by item id.
# Every code and every item id in exit.yaml must have a matching entry here.
# URLs and asOf dates stay canonical in data/stages/exit.yaml — never duplicated here.
# scripts/check-i18n-parity.mjs enforces id-set + key-set parity across languages.

countries:
  DE:
    name: "Германия"
  GB:
    name: "Великобритания"
  US:
    name: "США"
  NL:
    name: "Нидерланды"
  RS:
    name: "Сербия"
items:
  de-tax-deregister:
    label: "Снятие с налогового учёта в Finanzamt (Abmeldung der Steuerpflicht)"
    note: "Неограниченная налоговая обязанность прекращается, когда вы отказываетесь от места жительства в Германии, а это происходит через снятие с регистрации по адресу из следующего пункта — отдельной формы снятия с учёта для Finanzamt подавать не нужно. Подайте итоговую декларацию за неполный год выезда и сохраните письменное подтверждение даты отъезда для целей СИДН с Хорватией. Декларацией занимается местный Finanzamt, а BZSt — федеральный орган по трансграничным налоговым вопросам."
  de-address-deregister:
    label: "Снятие с регистрации по адресу (Abmeldung) в Bürgeramt"
    note: "По закону — в течение двух недель после выезда. Получите Abmeldebestätigung: арендодатели и банки часто его требуют."
  de-pension-transfer:
    label: "Запросите выписку о взносах в Deutsche Rentenversicherung"
    note: "Запросите Rentenauskunft с историей взносов. Взносы могут быть частично возвращены после 24+ месяцев за пределами ЕС/ЕЭЗ или переносимы по СИДН."
  de-health-cancel:
    label: "Отмените обязательную медстраховку (GKV) с даты отъезда"
    note: "Уведомьте свою Krankenkasse письменно с указанием даты отъезда. Покрытие сохраняется до конца месяца членства."
  de-bank-notify:
    label: "Сообщите немецким банкам новый адрес; сохраните IBAN на 90 дней"
    note: "Держите счёт открытым, пока хорватская зарплата и все автоплатежи полностью не переедут: закроете раньше — повиснут регулярные списания, о которых вы забыли. Оставит ли немецкий банк вас клиентом-нерезидентом, зависит от банка, поэтому получите его позицию письменно; BaFin — надзорный орган, куда обращаться, если счёт закрыли без надлежащего уведомления."
  gb-hmrc-notify:
    label: "Уведомьте HMRC об отъезде (форма P85)"
    note: "Заполните форму P85, чтобы установить статус налогового нерезидента Великобритании. От этого зависит налогообложение вашего последнего дохода в UK и прекращение неверных удержаний PAYE."
  gb-ni-voluntary:
    label: "Рассмотрите добровольные взносы National Insurance"
    note: "Для любой новой государственной пенсии нужно 10 засчитанных лет, для полной ставки — 35; если ваш стаж начался до апреля 2016 года, потребуется больше 35. Добровольные взносы Class 2 за периоды за рубежом отменены с 6 апреля 2026 года: с 2026-27 доступен только Class 3, а для новой заявки нужно 10 непрерывных лет проживания в Великобритании или 10 засчитанных лет стажа. Если вы уже платили Class 2 за рубежом, вы можете перейти на Class 3 без выполнения этого условия."
  gb-bank-notify:
    label: "Сообщите британским банкам о переезде; обновите адрес для переписки"
    note: "Обновите адрес для переписки до отъезда, а не после. Политика в отношении клиентов-нерезидентов сильно различается между банками, а некоторые просто закрывают счёт, поэтому запросите позицию своего банка письменно, а не полагайтесь на догадки; FCA — регулятор, куда эскалировать."
  gb-council-tax:
    label: "Отмените регистрацию council tax с даты отъезда"
    note: "GOV.UK says прямо: при переезде за границу свяжитесь с местным советом и оставьте адрес для пересылки. Советы выставляют счета сами, поэтому сделайте это письменно с указанием последнего дня проживания в Великобритании — переплаты возвращают, а недоплаты превращаются в долг, который последует за вами."
  us-fbar:
    label: "Подайте FBAR (FinCEN 114), если зарубежные счета превышают $10 тыс."
    note: "Граждане США обязаны подавать FBAR ежегодно независимо от места жительства. За неумышленное нарушение — штраф с поправкой на инфляцию (пятизначная сумма за каждый неподанный отчёт). Обратите внимание: налоговое соглашение США — Хорватия, подписанное в 2022 году, ещё не вступило в силу, и от FBAR не освобождает ни одно соглашение."
  us-state-tax:
    label: "Оформите нерезидентство по налогам штата (зависит от штата)"
    note: "Некоторые штаты США (CA, NY, NJ) настойчиво заявляют о вашем резидентстве даже после физического отъезда. Пройдите процедуру смены домициля своего штата и сохраните документы."
  us-irs-address:
    label: "Обновите адрес в IRS (форма 8822); сохраните активный SSN"
    note: "Подайте форму 8822, чтобы обновить адрес в IRS. Ваш SSN остаётся действительным и нужен для ежегодных деклараций и FBAR."
  us-mail-forward:
    label: "Настройте пересылку почты или сервис виртуального адреса в США"
    note: "Пересылка USPS рассчитана на адреса внутри США, а при переезде за границу заявление о смене адреса нужно подать лично в отделении до отъезда. Пересылка действует 12 месяцев (18 за плату) и не распространяется на рекламную почту. Для уведомлений IRS и налоговой переписки штата, которые идут годами, стандартное решение — виртуальный почтовый ящик в США."
  nl-brp-deregister:
    label: "Снимитесь с учёта в BRP (Basisregistratie Personen) в муниципалитете"
    note: "Заявите об эмиграции в gemeentehuis. Вы получите подтверждение эмиграции из BRP — сохраните его для налоговой службы и банка Нидерландов."
  nl-belastingdienst:
    label: "Уведомьте Belastingdienst о дате эмиграции"
    note: "Налоговое резидентство Нидерландов заканчивается датой эмиграции. Подайте M-форму (декларацию за неполный год) за год отъезда. Belastingdienst пришлёт её автоматически."
  nl-aow-pension:
    label: "Свяжитесь с SVB по правам на AOW (государственную пенсию)"
    note: "Пенсия AOW накапливается по 2% за каждый год проживания в Нидерландах в течение 50 лет до достижения вашего возраста AOW. Уточните в SVB свою историю накоплений и то, как проживание в Хорватии повлияет на будущие выплаты."
  nl-zorgtoeslag:
    label: "Отмените zorgtoeslag (пособие на медстраховку) при отъезде"
    note: "Уведомьте Belastingdienst Toeslagen немедленно — продолжать получать zorgtoeslag после эмиграции считается мошенничеством, деньги придётся вернуть."
  rs-tax-deregister:
    label: "Подайте прекращение налогового резидентства в Poreska uprava"
    note: "Подайте заявление об аннулировании справки о налоговом резидентстве. Сербия применяет правило 183 дней плюс тест центра жизненных интересов. Сохраните документы, подтверждающие начало резидентства в Хорватии."
  rs-address-deregister:
    label: "Снимитесь с учёта в реестре жителей (MUP)"
    note: "Уведомьте MUP о постоянном выезде. Сербский паспорт можно сохранить без сербского налогового резидентства — это разные регистрации."
  rs-pio-pension:
    label: "Запросите выписку о взносах из фонда PIO"
    note: "Получите историю пенсионных взносов в фонде PIO до отъезда. Соглашение о социальном обеспечении между Сербией и Хорватией действует — взносы могут засчитываться в хорватские права."
  rs-rfzo-cancel:
    label: "Отмените медстраховку RFZO при переходе на HZZO"
    note: "Как только начнётся покрытие HZZO в Хорватии, уведомьте RFZO письменно, чтобы обязательства по взносам перестали накапливаться. RFZO документирует постановку на учёт куда лучше, чем снятие, поэтому спрашивайте процедуру прекращения напрямую в своём отделении, а не ищите её на сайте."
