# Translatable strings for data/fees.yaml — keyed by `id`.
# Every id in fees.yaml must have a matching entry here.
# scripts/check-i18n-parity.mjs enforces id-set + key-set parity across languages.

apostille-origin:
  label: "Apostilles (in origin country, per document)"
  note: "Varies by origin country and issuing authority. Budget for 3–4 documents."
court-translation:
  label: "Court-certified translations (per page)"
  note: "Per page. Budget 8–15 pages across all documents."
criminal-background:
  label: "Criminal background check (origin country)"
  note: "Fee varies widely by country. May require a notary or apostille."
mup-residency-permit:
  label: "Residence permit fee (MUP)"
  note: "Depends on permit type and where you apply. Digital Nomad temporary stay: 46.45 EUR at a police administration, 55.74 EUR at an embassy or consulate. EU Blue Card: 74.32 EUR."
biometric-card:
  label: "Biometric residence card"
  note: "Issued separately from the permit decision. 31.85 EUR (59.73 EUR accelerated), paid with a slip from the police station at a post office, FINA or bank — plus a 9.29 EUR administrative fee."
oib-registration:
  label: "OIB registration"
  note: "Free of charge."
hzzo-retroactive:
  label: "HZZO health insurance — retroactive contributions if late enrollment"
  note: "Only applies if you were uninsured during a gap period. ~60–80 EUR/month of gap. Budget conservatively."
